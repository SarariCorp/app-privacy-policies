<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">App logo placeholder template</title>
  <desc id="desc">Copy this placeholder into each app folder and replace it with the app logo file.</desc>
  <rect width="320" height="320" rx="44" fill="#0b1020" stroke="#8fb8f6" stroke-opacity="0.75"/>
  <rect x="20" y="20" width="280" height="280" rx="30" fill="#101a31" stroke="#c8dcff" stroke-opacity="0.28" stroke-dasharray="8 8"/>
  <text x="160" y="140" text-anchor="middle" fill="#f6f9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="34">APP LOGO</text>
  <text x="160" y="178" text-anchor="middle" fill="#afc0df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">PLACEHOLDER</text>
  <text x="160" y="212" text-anchor="middle" fill="#8598bc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Replace this file</text>
</svg>
