<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Replaceable app logo placeholder</title>
  <desc id="desc">Template app logo placeholder. Replace this file with an official app logo for each app folder.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8fb0ff"/>
      <stop offset="100%" stop-color="#8a6cff"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#060914" stroke="#3d4f7a"/>
  <rect x="32" y="32" width="64" height="64" rx="16" fill="url(#g)"/>
  <text x="64" y="115" text-anchor="middle" font-size="9" font-family="Arial, sans-serif" fill="#d9e3ff">LOGO PLACEHOLDER</text>
</svg>
