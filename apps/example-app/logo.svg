<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-labelledby="title desc">
  <title id="title">Example app logo placeholder</title>
  <desc id="desc">Replaceable placeholder logo asset for the example app policy folder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070b17"/>
      <stop offset="1" stop-color="#121d39"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9ec2ff"/>
      <stop offset="1" stop-color="#c9a4ff"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="20" fill="url(#bg)"/>
  <circle cx="76" cy="90" r="36" fill="#1d2b52" stroke="url(#line)" stroke-width="4"/>
  <path d="M58 90h36" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <path d="M76 72v36" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  <text x="124" y="82" fill="#edf3ff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">[APP NAME]</text>
  <text x="124" y="112" fill="#b9c9e9" font-family="Segoe UI, Arial, sans-serif" font-size="13">Replace this file with your official app logo</text>
</svg>
